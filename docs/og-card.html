<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #0a0f0c; }

  .card {
    width: 1280px;
    height: 640px;
    background: #0a0f0c;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    font-family: 'Inter', sans-serif;
  }

  /* a faint 8px rhythm grid: the thing the tool actually measures */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right,  rgba(16,185,129,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(16,185,129,.055) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  .glow {
    position: absolute;
    width: 620px; height: 620px;
    right: -180px; top: -240px;
    background: radial-gradient(circle, rgba(16,185,129,.13), transparent 62%);
    pointer-events: none;
  }

  .top { display: flex; align-items: center; gap: 20px; position: relative; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #7f9188;
  }

  .mid { position: relative; }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 78px;
    line-height: 1.02;
    letter-spacing: -.035em;
    color: #e4ebe7;
  }

  h1 .dot { color: #10b981; }

  p.tagline {
    margin-top: 22px;
    font-size: 25px;
    line-height: 1.45;
    color: #a3b3aa;
    max-width: 800px;
    font-weight: 400;
  }

  /* the concrete example: one written line becomes a resolved, audited token */
  .demo {
    position: relative;
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .src {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    color: #a3b3aa;
    background: #0f1613;
    border: 1px solid #1f2d25;
    border-radius: 10px;
    padding: 15px 20px;
    white-space: nowrap;
  }
  .src .b { color: #e4ebe7; font-weight: 700; }
  .src .hex { color: #34d399; }

  .arrow { color: #10b981; font-size: 26px; font-weight: 700; }

  .chip {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #0f1613;
    border: 1px solid #1f2d25;
    border-radius: 10px;
    padding: 13px 22px 13px 15px;
    white-space: nowrap;
  }

  .swatch {
    width: 38px; height: 38px;
    border-radius: 7px;
    background: #10b981;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
  }

  .chip .name { font-size: 19px; font-weight: 600; color: #e4ebe7; }
  .chip .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #7f9188;
  }
  .chip .aa {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .07em;
    color: #0a0f0c;
    background: #10b981;
    border-radius: 5px;
    padding: 4px 9px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="top">
    <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
      <rect x="4"  y="4"  width="14" height="14" rx="2" fill="#10b981" opacity="1"    />
      <rect x="46" y="4"  width="14" height="14" rx="2" fill="#10b981" opacity="0.62" />
      <rect x="4"  y="46" width="14" height="14" rx="2" fill="#10b981" opacity="0.38" />
      <rect x="46" y="46" width="14" height="14" rx="2" fill="#10b981" opacity="0.22" />
      <g fill="#34d399">
        <rect x="18" y="4"  width="6" height="56" rx="1.5" />
        <rect x="40" y="4"  width="6" height="56" rx="1.5" />
        <rect x="4"  y="18" width="56" height="6" rx="1.5" />
        <rect x="4"  y="40" width="56" height="6" rx="1.5" />
      </g>
    </svg>
    <span class="eyebrow">Runs entirely in your browser</span>
  </div>

  <div class="mid">
    <h1>Design<span class="dot">.md</span><br>Visual Explorer</h1>
    <p class="tagline">Drop a design-system markdown file. Get a browsable, audited design system, with every value traced back to the line that declared it.</p>
  </div>

  <div class="demo">
    <div class="src">- **Primary**: <span class="hex">#10b981</span></div>
    <span class="arrow">&rarr;</span>
    <div class="chip">
      <span class="swatch"></span>
      <span class="name">Primary</span>
      <span class="meta">#10b981</span>
      <span class="meta">7.62:1</span>
      <span class="aa">AA</span>
    </div>
  </div>
</div>
</body>
</html>
