name: Capture screenshots

# README screenshots are captured from the real application rather than mocked up, so they cannot
# drift into showing a UI that no longer exists. Every number visible in them was produced by the
# parser on a bundled sample.
#
# The PNGs are published as a build artifact. Download the artifact, drop the files into docs/, and
# commit them; re-run this workflow whenever the interface changes materially.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/capture-screenshots.mjs'

permissions:
  contents: read

jobs:
  capture:
    name: Drive the app and capture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://localhost:4173/; then
              echo "preview is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview never came up" >&2
          exit 1

      - name: Capture and smoke test
        run: node scripts/capture-screenshots.mjs
        env:
          BASE_URL: http://localhost:4173/
          OUTPUT_DIR: shots

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error
